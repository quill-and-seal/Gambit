<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Gambit — banc d'essai</title>
<link rel="stylesheet" href="../styles/gambit.css">
<style>
  body { margin: 0; padding: 16px; background: #2b2b33; color: #e8e2d6; font-family: system-ui, sans-serif; display: flex; gap: 16px; align-items: flex-start; }
  .application { background: #f3eee4; color: #222; border-radius: 6px; box-shadow: 0 6px 24px rgba(0,0,0,.5); display: flex; flex-direction: column; }
  .window-header { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: #1f1d22; color: #eee; border-radius: 6px 6px 0 0; }
  .window-title { font-size: 14px; margin: 0; flex: 1; }
  .window-header button { background: none; color: inherit; border: 1px solid #666; border-radius: 4px; cursor: pointer; }
  .window-content { padding: 10px; }
  button { font: inherit; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; padding: 4px 8px; border: 1px solid #999; border-radius: 4px; background: #e6dfd2; }
  #side { display: flex; flex-direction: column; gap: 12px; }
  #chat { list-style: none; padding: 0; margin: 0; width: 280px; }
  #chat li { background: #f3eee4; color: #222; padding: 8px; border-radius: 6px; margin-bottom: 8px; }
  canvas { width: 280px; height: 280px; }
</style>
</head>
<body>
<div id="apps"></div>
<div id="side"><canvas id="scene" width="800" height="800"></canvas><ul id="chat"></ul></div>
<script src="foundry-mock.js"></script>
<script type="module">
  import "../scripts/main.js";
  import { drawBoard } from "../scripts/board-texture.js";
  import { gameOf } from "../scripts/game.js";
  Hooks.callAll("init");
  Hooks.callAll("ready");
  const draw = () => {
    const tile = canvas.scene.tiles[0];
    if (tile) drawBoard(document.getElementById("scene").getContext("2d"), gameOf(tile), 800);
  };
  Hooks.on("updateTile", draw);
  Hooks.on("createTile", () => setTimeout(draw));
  window.gambit = game.modules.get("gambit").api;
  window.ready = true;
</script>
</body>
</html>
